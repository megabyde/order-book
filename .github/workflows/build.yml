name: Build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.preset }} / ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    env:
      # macOS clang is AppleClang. Linux Clang is pinned to 19: libstdc++ declares std::expected only
      # when the compiler reports C++20 concepts (__cpp_concepts >= 202002L), which Clang 18 does not.
      CC: ${{ matrix.compiler == 'gcc' && 'gcc-14' || matrix.os == 'ubuntu-latest' && 'clang-19' || 'clang' }}
      CXX: ${{ matrix.compiler == 'gcc' && 'g++-14' || matrix.os == 'ubuntu-latest' && 'clang++-19' || 'clang++' }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 200M
      CCACHE_FAMILY: ccache-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.preset }}
      CONAN_FAMILY: ${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.preset }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        preset: [debug, release, sanitize, sanitize-tsan]
        compiler: [gcc, clang]
        exclude:
          - os: macos-latest
            compiler: gcc

    steps:
      - uses: actions/checkout@v7
      # Tool pins live in .github/ci.env, shared across workflows; loading it into
      # GITHUB_ENV exposes the pins to every later step's ${{ env.* }}. The anchor
      # dedupes the step across this file's jobs (anchors are file-scoped, hence
      # still one step per job). shell: bash is a no-op on Linux/macOS and makes the
      # alias valid in the Windows job, where the default is pwsh. RUNNER_IMAGE copies the
      # runner's own variables, which ${{ env.* }} cannot read, for the Conan cache keys.
      - &load-ci-env
        name: Load CI env
        shell: bash
        run: |
          cat .github/ci.env >> "$GITHUB_ENV"
          echo "RUNNER_IMAGE=$ImageOS-$ImageVersion" >> "$GITHUB_ENV"
      - name: Install GCC 14
        if: runner.os == 'Linux' && matrix.compiler == 'gcc'
        run: sudo apt-get update && sudo apt-get install -y gcc-14 g++-14
      - name: Install Clang 19
        if: runner.os == 'Linux' && matrix.compiler == 'clang'
        run: sudo apt-get update && sudo apt-get install -y clang-19
      - uses: conan-io/setup-conan@v1
        with:
          version: ${{ env.CONAN_VERSION }}
      # Conan packages follow from the key's inputs, so a run that hits the key has nothing to
      # save. The runner image is in the key because an image update can change the compiler,
      # and with it every package ID, without changing any keyed file. As with ccache, only pushes
      # to main save, so pull requests start from main's packages without storing their own.
      - &restore-conan
        id: conan
        uses: actions/cache/restore@v6
        with:
          path: ~/.conan2/p
          key: conan-${{ env.CONAN_VERSION }}-${{ env.CONAN_FAMILY }}-${{ env.RUNNER_IMAGE }}-${{ hashFiles('conanfile.py', 'conan.lock', 'profiles/**', 'conan/**') }}
          restore-keys: conan-${{ env.CONAN_VERSION }}-${{ env.CONAN_FAMILY }}-${{ env.RUNNER_IMAGE }}-
      # The Conan toolchain probes for mold only on Linux, so the macOS leg installs ccache alone.
      # Refresh apt metadata first because runner images can retain package lists whose versions no
      # longer exist
      - name: Install ccache and mold
        run: ${{ runner.os == 'macOS' && 'brew install ccache' || 'sudo apt-get update && sudo apt-get install -y ccache mold' }}
      # Every run starts from the newest ccache its family saved on main, and only pushes to main
      # save one: a PR's cache is visible to that PR alone. "-run-" ends the family name, so the
      # sanitize prefix does not also match sanitize-tsan. prune-ccache deletes the older entries.
      - &restore-ccache
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ${{ env.CCACHE_FAMILY }}-run-${{ github.run_id }}
          restore-keys: ${{ env.CCACHE_FAMILY }}-run-
      # ccache keeps its statistics in the cache directory; zeroing them makes the stats step count
      # this run alone
      - run: ccache -z
      - run: make lock-check
      - run: make bootstrap
      - &save-conan
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.conan.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.conan2/p
          key: ${{ steps.conan.outputs.cache-primary-key }}
      # The runner kernel randomizes mmap with more bits than the TSan runtime's fixed memory layout
      # allows, which aborts every instrumented test at startup.
      - name: Fit mmap randomization to TSan
        if: runner.os == 'Linux' && matrix.preset == 'sanitize-tsan'
        run: sudo sysctl vm.mmap_rnd_bits=28
      - run: make ${{ matrix.preset }}
      - name: ccache stats
        run: ccache -sv
      - &save-ccache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: ${{ env.CCACHE_FAMILY }}-run-${{ github.run_id }}
      # Install the application to a throwaway prefix and replay the sample feed with it, verifying the
      # install() rule.
      - name: Verify install (release)
        if: matrix.preset == 'release'
        run: |
          cmake --install build/release --prefix "$RUNNER_TEMP/install"
          cmake -DAPP="$RUNNER_TEMP/install/bin/order_book" -DINPUT=tests/data/sample.csv \
            -DEXPECTED=tests/data/sample.expected -DACTUAL="$RUNNER_TEMP/sample.actual" \
            -P tests/compare_output.cmake

  # Windows has no make; it drives Conan and the CMake presets directly. The Visual
  # Studio generator (selected by conanfile.py on Windows) locates MSVC itself, so no
  # vcvars environment or third-party action is needed. Debug runs the tests with the MSVC STL's
  # checked iterators; sanitize-asan uses MSVC's AddressSanitizer, which has no UBSan or TSan
  # counterpart. Coverage is Unix-only.
  windows:
    name: ${{ matrix.preset }} / windows-latest / msvc
    runs-on: windows-latest
    env:
      CONAN_FAMILY: windows-msvc-${{ matrix.preset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: debug
            profile: -pr=profiles/default -s="build_type=Debug"
          - preset: release
            profile: -pr=profiles/default -s="build_type=Release"
          - preset: sanitize-asan
            profile: -pr=profiles/sanitize-asan-msvc
    steps:
      - uses: actions/checkout@v7
      - *load-ci-env
      - uses: conan-io/setup-conan@v1
        with:
          version: ${{ env.CONAN_VERSION }}
      - *restore-conan
      - name: Install sanitizer settings
        if: matrix.preset == 'sanitize-asan'
        run: conan config install conan/
      # The instrumented tests load the ASan runtime DLL from the MSVC tools directory, which only
      # a Developer PowerShell puts on PATH
      - name: Put the ASan runtime on PATH
        if: matrix.preset == 'sanitize-asan'
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $tools = (Get-Content "$vs\VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt").Trim()
          "$vs\VC\Tools\MSVC\$tools\bin\Hostx64\x64" >> $env:GITHUB_PATH
      - name: Install dependencies (${{ matrix.preset }})
        run: conan install . ${{ matrix.profile }} --build=missing --lockfile=conan.lock
      - *save-conan
      - name: Build and test (${{ matrix.preset }} preset)
        run: cmake --workflow --preset ${{ matrix.preset }}
      - name: Verify install (release)
        if: matrix.preset == 'release'
        shell: cmd
        run: |
          cmake --install build\release --prefix "%RUNNER_TEMP%\install" || exit /b 1
          cmake -DAPP="%RUNNER_TEMP%\install\bin\order_book.exe" -DINPUT=tests/data/sample.csv -DEXPECTED=tests/data/sample.expected -DACTUAL="%RUNNER_TEMP%\sample.actual" -P tests/compare_output.cmake || exit /b 1

  coverage:
    name: coverage / ubuntu-latest / gcc
    runs-on: ubuntu-latest
    env:
      CC: gcc-14
      CXX: g++-14
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 200M
      CCACHE_FAMILY: ccache-coverage
      CONAN_FAMILY: coverage
      GCOV_EXECUTABLE: gcov-14
    steps:
      - uses: actions/checkout@v7
      - *load-ci-env
      - run: sudo apt-get update && sudo apt-get install -y ccache mold gcc-14 g++-14
      - uses: conan-io/setup-conan@v1
        with:
          version: ${{ env.CONAN_VERSION }}
      - *restore-conan
      - *restore-ccache
      - run: python3 -m pip install --break-system-packages --user gcovr==${{ env.GCOVR_VERSION }}
      - run: make bootstrap
      - *save-conan
      # Builds, runs the suite, and fails if line coverage drops below the floor.
      - run: make coverage-report
      - *save-ccache
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: build/coverage/coverage-report/

  # Builds the libFuzzer targets, runs their seeds, and fuzzes each for 60 seconds. A failing input
  # is uploaded so it can be replayed locally.
  fuzz:
    name: fuzz / ubuntu-latest / clang
    runs-on: ubuntu-latest
    env:
      CC: clang-19
      CXX: clang++-19
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 200M
      CCACHE_FAMILY: ccache-fuzz
      CONAN_FAMILY: fuzz
    steps:
      - uses: actions/checkout@v7
      - *load-ci-env
      # libFuzzer and the sanitizer runtimes are in compiler-rt, installed explicitly
      - run: sudo apt-get update && sudo apt-get install -y ccache mold clang-19 libclang-rt-19-dev
      - uses: conan-io/setup-conan@v1
        with:
          version: ${{ env.CONAN_VERSION }}
      - *restore-conan
      - *restore-ccache
      - run: make fuzz-run FUZZ_CC=clang-19 FUZZ_CXX=clang++-19
      - *save-conan
      - *save-ccache
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-crashes
          path: build/fuzz/crashes/

  # Each push to main saves a new ccache per job family. Keeping only the newest of each, and deleting
  # entries under any other key, holds the store well under GitHub's 10 GB, past which it evicts the
  # least recently used caches, Conan's included. Deleting needs actions: write, so this job runs
  # no project code.
  prune-ccache:
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, coverage, fuzz]
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: |
          gh cache list --key ccache- --limit 1000 --json key,createdAt --jq '
            (map(select(.key | test("-run-[0-9]+$") | not)) | .[].key),
            (map(select(.key | test("-run-[0-9]+$")))
              | group_by(.key | sub("-run-[0-9]+$"; ""))
              | map(sort_by(.createdAt) | .[:-1]) | flatten | .[].key)' |
            sort -u | while read -r key; do gh cache delete "$key"; done

  lint:
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
      CONAN_FAMILY: lint
    steps:
      - uses: actions/checkout@v7
      - *load-ci-env
      - uses: conan-io/setup-conan@v1
        with:
          version: ${{ env.CONAN_VERSION }}
      - *restore-conan
      # ~/.local/bin precedes /usr/bin on the runner, so these shadow the image's
      # unpinned clang-format/clang-tidy.
      - name: Pin lint toolchain
        run: |
          # cmakelang reads .cmake-format.yaml through PyYAML without declaring the dependency. Pin
          # it explicitly instead of relying on the runner image.
          python3 -m pip install --break-system-packages --user \
            clang-format==${{ env.CLANG_FORMAT_VERSION }} \
            clang-tidy==${{ env.CLANG_TIDY_VERSION }} \
            cmakelang==${{ env.CMAKELANG_VERSION }} \
            pyyaml==${{ env.PYYAML_VERSION }} \
            ruff==${{ env.RUFF_VERSION }}
          npm install -g \
            prettier@${{ env.PRETTIER_VERSION }} \
            markdownlint-cli2@${{ env.MARKDOWNLINT_CLI2_VERSION }}
      - run: make bootstrap
      - *save-conan
      - run: make format-check
      - run: make lint
