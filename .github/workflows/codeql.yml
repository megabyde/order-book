name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "37 9 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: codeql / ubuntu-latest / cpp
    runs-on: ubuntu-latest
    env:
      CC: gcc-14
      CXX: g++-14
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      # Tool pins live in .github/ci.env, shared across workflows.
      - name: Load CI env
        run: cat .github/ci.env >> "$GITHUB_ENV"
      - run: sudo apt-get update && sudo apt-get install -y gcc-14 g++-14
      - uses: github/codeql-action/init@v4.38.2
        with:
          languages: c-cpp
      - uses: conan-io/setup-conan@v1
        with:
          version: ${{ env.CONAN_VERSION }}
          cache_packages: true
      - run: make release
      - uses: github/codeql-action/analyze@v4.38.2
