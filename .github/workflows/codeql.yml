name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "37 9 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: codeql / ubuntu-latest / cpp
    runs-on: ubuntu-latest
    env:
      CC: gcc-14
      CXX: g++-14
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      # Tool pins live in .github/ci.env, shared across workflows.
      - name: Load CI env
        run: |
          cat .github/ci.env >> "$GITHUB_ENV"
          echo "RUNNER_IMAGE=$ImageOS-$ImageVersion" >> "$GITHUB_ENV"
      - run: sudo apt-get update && sudo apt-get install -y gcc-14 g++-14
      - uses: github/codeql-action/init@v4.38.2
        with:
          languages: c-cpp
      - uses: conan-io/setup-conan@v1
        with:
          version: ${{ env.CONAN_VERSION }}
      # Only pushes to main save the Conan cache; pull requests restore main's
      - id: conan
        uses: actions/cache/restore@v6
        with:
          path: ~/.conan2/p
          key: conan-${{ env.CONAN_VERSION }}-codeql-${{ env.RUNNER_IMAGE }}-${{ hashFiles('conanfile.py', 'conan.lock', 'profiles/**', 'conan/**') }}
          restore-keys: conan-${{ env.CONAN_VERSION }}-codeql-${{ env.RUNNER_IMAGE }}-
      - run: make release
      - if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.conan.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.conan2/p
          key: ${{ steps.conan.outputs.cache-primary-key }}
      - uses: github/codeql-action/analyze@v4.38.2
